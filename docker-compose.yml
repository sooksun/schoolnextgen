services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Production runs against an EXTERNAL MariaDB on the LAN (e.g. 192.168.1.4:3306).
    # No internal mysql service — DATABASE_URL is read from .env via compose
    # substitution. Prisma uses the mysql:// protocol URL for MariaDB too.
    # All values are double-quoted so colons inside error messages / URLs don't
    # confuse the YAML parser.
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL required - see .env.example}"
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET required - generate with openssl rand -hex 32}"
      SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME:-snx_session}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY required}"
      UPLOAD_DIR: "/data/uploads"
      MAX_UPLOAD_SIZE_MB: "${MAX_UPLOAD_SIZE_MB:-100}"
      NODE_ENV: "production"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:-http://localhost:3000}"
      # Port the Next.js server listens on INSIDE the container. Combined with
      # the ports mapping below this lets ops put the app on any host port
      # without code changes. Set both in .env to override the 3000 defaults:
      #   APP_PORT=9921   (host side  — what users connect to)
      #   PORT=9920       (container side — what Next.js binds to)
      PORT: "${PORT:-3000}"
      # In-process cron (daily reminder 15:30 + session cleanup 03:00 Asia/Bangkok).
      # For single-container deploys, default ON. For multi-replica, set to "false"
      # and hit /api/cron/[job] from an external scheduler with CRON_SECRET.
      CRON_ENABLED: "${CRON_ENABLED:-true}"
      CRON_SECRET: "${CRON_SECRET:-}"
      # Resend (T-131). Leave RESEND_API_KEY blank for dry-run (no emails sent).
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM:-SchoolNextgen <onboarding@resend.dev>}"
      # Sentry - leave blank to disable. Setting either DSN enables that scope.
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0.1}"
    ports:
      - "${APP_PORT:-3000}:${PORT:-3000}"
    volumes:
      # Uploads outlive the container - bind-mount to host or named volume.
      - snx-uploads:/data/uploads
    healthcheck:
      # CMD-SHELL so $PORT in the URL gets interpolated by the container shell.
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-3000}/api/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  snx-uploads:
